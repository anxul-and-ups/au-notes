name: Create GitHub Release with APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Signing Keystore Exists
        run: |
          if [ -f "my-upload-key.jks" ]; then
            echo "Found my-upload-key.jks in project root — release APK will be signed with upload key."
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: |
          if [ ! -f ".env.example" ] || grep -q "^GEMINI_API_KEY=\s*$" .env.example; then
            echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" > .env.example
          fi
          if [ ! -f ".env" ] || grep -q "^GEMINI_API_KEY=\s*$" .env; then
            cp .env.example .env
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-configuration-cache --stacktrace
          else
            gradle assembleRelease --no-configuration-cache --stacktrace
          fi

      - name: Package APK for Release
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/AU-Notes-App.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/AU-Notes-App.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
