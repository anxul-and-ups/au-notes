name: Android CI/CD Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Ensure Signing Keystore Exists
        run: |
          if [ -f "my-upload-key.jks" ]; then
            echo "Found my-upload-key.jks in project root — release APK will be signed with upload key."
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK with Gradle
        run: |
          if [ ! -f ".env.example" ] || grep -q "^GEMINI_API_KEY=\s*$" .env.example; then
            echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" > .env.example
          fi
          if [ ! -f ".env" ] || grep -q "^GEMINI_API_KEY=\s*$" .env; then
            cp .env.example .env
          fi
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          fi
          GRADLE_NET_ARGS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.tentatives=5 -Dorg.gradle.internal.repository.initial.backoff=2000"
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if $GRADLE_CMD assembleRelease --no-configuration-cache --stacktrace $GRADLE_NET_ARGS; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            echo "Transient dependency download error detected; retrying in 10s with --refresh-dependencies..."
            sleep 10
            GRADLE_NET_ARGS="$GRADLE_NET_ARGS --refresh-dependencies"
          done

      - name: Find and Prepare APK
        id: find_apk
        run: |
          mkdir -p build-apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} build-apks/ \;
          echo "Found APKs:"
          ls -la build-apks/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AU-Notes-APK
          path: build-apks/*.apk
          retention-days: 30
