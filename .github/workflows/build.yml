name: Android CI/CD Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Ensure Signing Keystore Exists
        run: |
          if [ -f "my-upload-key.jks" ]; then
            echo "Found my-upload-key.jks in project root — release APK will be signed with upload key."
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore for CI..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK with Gradle
        run: |
          if [ ! -f ".env.example" ] || grep -q "^GEMINI_API_KEY=\s*$" .env.example; then
            echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" > .env.example
          fi
          if [ ! -f ".env" ] || grep -q "^GEMINI_API_KEY=\s*$" .env; then
            cp .env.example .env
          fi
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Find and Prepare APK
        id: find_apk
        run: |
          mkdir -p build-apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} build-apks/ \;
          echo "Found APKs:"
          ls -la build-apks/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AU-Notes-APK
          path: build-apks/*.apk
          retention-days: 30
